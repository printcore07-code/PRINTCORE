
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>PRINTCORE | Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">

<div class="admin-container">

  <div class="admin-top">
    <a class="logo" href="index.html">PRINT<span>CORE</span></a>
    <a href="index.html" class="secondary-btn">VIEW STORE</a>
  </div>

  <section id="loginSection" class="admin-panel">
    <h2>ADMIN LOGIN</h2>
    <p class="product-description">Login with your authorised admin account.</p>

    <form id="loginForm">
      <div class="form-grid">
        <div class="form-field full">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="username">
        </div>

        <div class="form-field full">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
      </div>

      <div class="form-actions">
        <button class="action-btn" type="submit">LOGIN</button>
      </div>
      <p id="loginMessage" class="message"></p>
    </form>
  </section>

  <section id="dashboard" hidden>

    <div class="admin-top">
      <div>
        <span class="eyebrow">PRINTCORE MANAGEMENT</span>
        <h1>ADMIN DASHBOARD</h1>
      </div>
      <button id="logoutButton" class="secondary-btn" type="button">LOGOUT</button>
    </div>

    <section class="admin-panel">
      <h2>WHATSAPP SETTINGS</h2>
      <form id="settingsForm">
        <div class="form-field">
          <label for="whatsappNumber">WhatsApp number (with country code)</label>
          <input
            type="tel"
            id="whatsappNumber"
            placeholder="919876543210"
            required
          >
        </div>
        <div class="form-actions">
          <button class="action-btn" type="submit">SAVE NUMBER</button>
        </div>
        <p id="settingsMessage" class="message"></p>
      </form>
    </section>

    <section class="admin-form">
      <h2 id="productFormTitle">ADD NEW PRODUCT</h2>

      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="form-grid">

          <div class="form-field">
            <label for="productName">Product name</label>
            <input type="text" id="productName" required>
          </div>

          <div class="form-field">
            <label for="productPrice">Price (₹)</label>
            <input type="number" id="productPrice" min="0" step="0.01" required>
          </div>

          <div class="form-field full">
            <label for="productCategory">Category</label>
            <select id="productCategory" required>
              <option value="Wall Posters">Wall Posters</option>
              <option value="Car Posters">Car Posters</option>
              <option value="Bike Posters">Bike Posters</option>
              <option value="Movie Posters">Movie Posters</option>
              <option value="Supercar Posters">Supercar Posters</option>
              <option value="Custom Posters">Custom Posters</option>
            </select>
          </div>

          <div class="form-field">
            <label for="productImage1">Main image (required for new products)</label>
            <input type="file" id="productImage1" accept="image/*">
          </div>

          <div class="form-field">
            <label for="productImage2">Second image (optional)</label>
            <input type="file" id="productImage2" accept="image/*">
          </div>

          <div class="form-field full">
            <label for="productImage3">Third image (optional)</label>
            <input type="file" id="productImage3" accept="image/*">
          </div>

          <div class="form-field full">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" placeholder="Describe your poster..."></textarea>
          </div>

          <div class="form-field full">
            <label class="check-row">
              <input type="checkbox" id="productActive" checked>
              Show this product on the website
            </label>
          </div>

        </div>

        <div class="form-actions">
          <button class="action-btn" id="saveProductButton" type="submit">
            SAVE PRODUCT
          </button>
          <button class="secondary-btn" id="cancelEditButton" type="button" hidden>
            CANCEL EDIT
          </button>
        </div>

        <p id="productMessage" class="message"></p>
      </form>
    </section>

    <section class="admin-panel">
      <h2>YOUR PRODUCTS</h2>
      <div id="adminProductList" class="admin-product-list">
        Loading products...
      </div>
    </section>

  </section>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
