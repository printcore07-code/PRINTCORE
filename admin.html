
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINTCORE | Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">

<div class="admin-container">
  <a class="logo" href="index.html">PRINT<span>CORE.</span></a>
  <p class="eyebrow">STORE MANAGEMENT</p>
  <h1>ADMIN PANEL</h1>

  <section class="admin-panel" id="loginSection">
    <h2>Admin Login</h2>
    <form id="loginForm" class="admin-form">
      <label class="full">
        Email address
        <input type="email" id="email" required autocomplete="username">
      </label>
      <label class="full">
        Password
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <div class="full">
        <button class="admin-button" type="submit">LOGIN TO DASHBOARD</button>
      </div>
    </form>
    <p class="admin-message" id="loginMessage"></p>
  </section>

  <div id="dashboard" class="hidden">
    <section class="admin-panel">
      <div class="section-heading">
        <h2>Store Settings</h2>
        <button class="admin-button" id="logoutButton" type="button">LOG OUT</button>
      </div>
      <form id="settingsForm" class="admin-form">
        <label class="full">
          WhatsApp ordering number
          <input id="whatsappNumber" type="tel" placeholder="919876543210" required>
        </label>
        <div class="full">
          <button class="admin-button" type="submit">SAVE WHATSAPP NUMBER</button>
        </div>
      </form>
      <p class="admin-message" id="settingsMessage"></p>
    </section>

    <section class="admin-panel">
      <h2 id="productFormTitle">Add New Product</h2>
      <form id="productForm" class="admin-form">
        <input type="hidden" id="productId">

        <label>
          Product name
          <input id="productName" required>
        </label>

        <label>
          Price (₹)
          <input id="productPrice" type="number" min="0" step="0.01" required>
        </label>

        <label>
          Category
          <select id="productCategory" required>
            <option>Car Posters</option>
            <option>Wall Posters</option>
            <option>Bike Posters</option>
            <option>Movie Posters</option>
            <option>Custom Posters</option>
          </select>
        </label>

        <label>
          Product image
          <input id="productImage" type="file" accept="image/*">
        </label>

        <label class="full">
          Description
          <textarea id="productDescription" placeholder="Describe your poster..."></textarea>
        </label>

        <label class="full">
          <input id="productActive" type="checkbox" checked style="width:auto">
          Product available in store
        </label>

        <div class="full">
          <button class="admin-button" type="submit" id="saveProductButton">ADD PRODUCT</button>
          <button class="admin-button hidden" type="button" id="cancelEditButton">CANCEL EDIT</button>
        </div>
      </form>
      <p class="admin-message" id="productMessage"></p>
    </section>

    <section class="admin-panel">
      <h2>Your Products</h2>
      <div id="adminProductList">Loading products...</div>
    </section>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
